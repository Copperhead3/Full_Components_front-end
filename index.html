<!DOCTYPE html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullComponents Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar navbar-dark navbar-principal">

            <div class="container-fluid">
                <!-- =========================
                     LOGO
                ========================== -->
                <a href="index.html" class="navbar-brand logo">
                    <div class="logo-icon">
                        <i class="bi bi-pc-display"></i>
                    </div>

                    <div class="logo-texto">

                        <span class="logo-nombre">
                            FullComponents
                        </span>

                        <span class="logo-store">
                            STORE
                        </span>

                    </div>

                </a>



                <!-- =========================
                     BUSCADOR
                ========================== -->

                <form class="buscador" role="search">

                    <input type="search" class="form-control" placeholder="Buscar productos, marcas o categorías..."
                        aria-label="Buscar productos">


                    <button type="submit" class="btn btn-buscar">

                        <i class="bi bi-search"></i>

                    </button>

                </form>



                <!-- =========================
                     INICIO DE SESIÓN
                ========================== -->

                <a href="#" class="nav-opcion">

                    <i class="bi bi-person-circle"></i>

                    <div class="nav-opcion-texto">
                        <small>
                            Hola,
                        </small>
                        <span>
                            Iniciar sesión
                        </span>

                    </div>

                </a>
                <!-- =========================
                     CARRITO
                ========================== -->
                <a href="#" class="nav-opcion carrito">
                    <i class="bi bi-cart3"></i>


                    <div class="nav-opcion-texto">

                        <small>
                            Tu
                        </small>

                        <span>
                            Carrito
                        </span>

                    </div>


                    <span class="carrito-cantidad">
                        0
                    </span>

                </a>


            </div>

        </nav>

    </header>

    <main>

    </main>

    <footer>

    </footer>

    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/script.js"></script>
</body>

</html>
